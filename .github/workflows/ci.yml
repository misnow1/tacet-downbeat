name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here needs to write to the repo. Stated explicitly so the workflow
# carries its own answer rather than inheriting whatever the repo default is.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.12" }
          # The box itself runs on macOS for season one (design.md 5.8).
          - { os: macos-latest, python: "3.12" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check --output-format=github .

      - name: Format
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest -q

      # The ReaScript runs inside Reaper's own Lua 5.4 whatever the host OS, so
      # one platform is enough to cover it.
      - name: Install Lua
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.4

      - name: Test ReaScript
        if: runner.os == 'Linux'
        run: lua5.4 reaper/test_tacet_mirror.lua

      # The page's script is the same script whatever the browser, so one
      # platform covers it. Node is preinstalled on the runners.
      - name: Test browser script
        if: runner.os == 'Linux'
        run: node tests/test_app_js.mjs

  # The single context branch protection requires. The matrix job names are
  # generated -- "ubuntu-latest / py3.12" and friends -- so requiring them by
  # name means a required check goes stale the moment the matrix changes, and a
  # stale required check blocks every merge waiting for a run that never comes.
  # This job's name is fixed, so the matrix stays free to change.
  ci:
    name: CI passing
    # always(), or this is skipped when the matrix fails and a skipped required
    # check reads as success.
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every matrix leg succeeded
        if: needs.check.result != 'success'
        run: |
          echo "check result: ${{ needs.check.result }}"
          exit 1
